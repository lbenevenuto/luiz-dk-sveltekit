architecture:
  responsibilities: One source inventory supplies structural and documentary gates.
    Continuity validates facts; history validates archives and the Git base; checkpoint
    records explicit supplied facts; recovery only reconciles files and Git.
  boundaries: Read-only validators never write state or stage files. The explicit
    recorder owns canonical state and revision writes. Git snapshot selection is shared
    with commit gates; hDS supplies YAML and Markdown parsing only.
  abstraction: Small pure functions validate facts and references. The explicit recorder
    manages a bounded file-write lifecycle; test fixture classes own setup/cleanup
    state. No additional inheritance hierarchy is required.
  rationale: Reuse selected(), snapshot(), local(), digest() and hDS parsing. Separate
    history, current consistency and recording so commit and restart do not duplicate
    implementations or invent state.
  duplication_review: Canonical inventory, parsing and snapshot helpers are shared.
    Lexical and Python-clone sensors supplement review; semantic duplication is not
    automatically proven absent.
  risks: Saved facts can be incomplete or dishonest. Abrupt failures can occur between
    file writes and are detected as inconsistent; preserve the request and reconcile.
    Directory loss requires committed/pushed backup. No automatic capture of unsaved
    chat.
  cohesion_review: Inspect modules above 300 lines for coherent orchestration or declarative
    capsule templates; the hard 500-line limit still applies and no size waiver is
    introduced.
