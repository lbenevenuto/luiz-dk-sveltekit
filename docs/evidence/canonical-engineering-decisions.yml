  governance:
    context: Review the actual OS-owned governance component, its public definitions
      and consumer boundary; preserve unchanged inherited debt while enforcing evidence
      for changed implementation.
    reuse: Reuse governance scripts and engineering-quality change_validation. Generated
      capsule checks call these canonical packages.
    alternatives: Separate copies of validators and policy names were rejected because
      they drift. A new class hierarchy was rejected where the operation has no state,
      invariant or lifecycle requiring a class.
    architecture:
      responsibilities: Independent entrypoints enforce capsule completeness, release
        metadata and state while invoking the canonical validation packages.
      boundaries: Independent entrypoints enforce capsule completeness, release metadata
        and state while invoking the canonical validation packages.
      abstraction: Thin command entrypoints delegate to cohesive reusable functions.
        Avoid parallel implementations of staged or committed validation.
      rationale: Reuse governance scripts and engineering-quality change_validation.
        Generated capsule checks call these canonical packages.
      duplication_review: Canonical inventory, parsing and snapshot helpers are shared.
        Lexical and Python-clone sensors supplement review; semantic duplication is
