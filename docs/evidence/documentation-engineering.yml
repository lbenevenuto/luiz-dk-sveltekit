architecture:
  responsibilities: hDS owns document parsing, identities, reciprocal pairs, SemVer,
    links and assets. The OS adapter owns project adoption and Git scope.
  boundaries: hDS owns document parsing, identities, reciprocal pairs, SemVer, links
    and assets. The OS adapter owns project adoption and Git scope.
  abstraction: Small functions share hDS parsing and OS scope utilities. The adapter
    does not inspect or repair product implementation.
  rationale: Reuse hds_validation modules through project_hds and hds_gate. Preserve
    hDS independence from source-code quality.
  duplication_review: Canonical inventory, parsing and snapshot helpers are shared.
    Lexical and Python-clone sensors supplement review; semantic duplication is not
    automatically proven absent.
  risks: Recorded evidence can be dishonest; hashes prove freshness, not truth. Human/agent
    review and relevant behavior tests remain necessary. Product code is never enrolled
    by infrastructure export.
  cohesion_review: Inspect modules above 300 lines for coherent orchestration or declarative
    capsule templates; the hard 500-line limit still applies and no size waiver is
    introduced.
