architecture:
  responsibilities: Capture, comparison and reporting provide evidence. Explicit Human
    Visual Acceptance remains the parity authority.
  boundaries: Capture, comparison and reporting provide evidence. Explicit Human Visual
    Acceptance remains the parity authority.
  abstraction: Use existing Node entrypoints and stable public browser/test APIs.
    Keep comparison algorithms separate from capture and acceptance.
  rationale: Reuse tooling/visual-review unchanged; no substitute screenshots or artificial
    acceptance are generated.
  duplication_review: Canonical inventory, parsing and snapshot helpers are shared.
    Lexical and Python-clone sensors supplement review; semantic duplication is not
    automatically proven absent.
  risks: Recorded evidence can be dishonest; hashes prove freshness, not truth. Human/agent
    review and relevant behavior tests remain necessary. Product code is never enrolled
    by infrastructure export.
  cohesion_review: Inspect modules above 300 lines for coherent orchestration or declarative
    capsule templates; the hard 500-line limit still applies and no size waiver is
    introduced.
resolution:
  kind: canonical_export
  cause_or_need: Review the actual OS-owned visual-review component, its public definitions
    and consumer boundary; preserve unchanged inherited debt while enforcing evidence
    for changed implementation.
  official_mechanisms: Use the canonical OS modules and hDS public validation entrypoints,
    keeping index and commit checks on the same implementation.
  solution: Reuse tooling/visual-review unchanged; no substitute screenshots or artificial
    acceptance are generated.
  regression: Source inspection below checks syntax and records hashes. Full release
    regressions are separate release evidence; consumer readiness is not certified.
  workaround: false
