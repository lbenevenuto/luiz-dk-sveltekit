name: Weekly Dependency Updates
on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

# Prevent overlapping runs (e.g. a manual run during the scheduled one).
concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  dependency-updates:
    name: Claude dependency update pass
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT so Claude can push the branch and open a PR that triggers CI.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The prompt is sourced from spiriidk/ai-standards (org-owned) and pinned to a
      # reviewed commit via ?ref=<sha>. Pinning prevents an unreviewed or compromised
      # commit on that repo's default branch from driving this run, which holds a write
      # token and unrestricted Bash. To adopt a newer prompt, review the change there and
      # bump PROMPT_REF to the new commit SHA.
      - name: Fetch dependency-update prompt
        id: prompt
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PROMPT_REF: c5749f586b5712c00229d8154e5e713ce92b576a
        run: |
          set -eo pipefail
          # Write outside the workspace so Claude (running here with contents: write)
          # can't accidentally commit the prompt into the dependency-update branch.
          gh api "repos/spiriidk/ai-standards/contents/prompts/stewardship-dependency-updates-node-repos.md?ref=${PROMPT_REF}" \
            --jq '.content' | base64 -d | sed -n '/^## The prompt/,$p' > "$RUNNER_TEMP/prompt.md"
          if [ ! -s "$RUNNER_TEMP/prompt.md" ]; then
            echo "::error::Fetched dependency-update prompt is empty" >&2
            exit 1
          fi
          {
            echo 'value<<__PROMPT_EOF__'
            echo "REPO: ${{ github.repository }}"
            echo
            cat "$RUNNER_TEMP/prompt.md"
            echo ''         # trailing newline so the closing delimiter is on its own line
            echo '__PROMPT_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude dependency update
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT drives all git / gh / PR operations (used automatically by the action).
          github_token: ${{ secrets.RELEASE_TOKEN }}
          prompt: ${{ steps.prompt.outputs.value }}
          claude_args: |
            --allowedTools "Bash,Edit,MultiEdit,Read,Glob,Grep"
