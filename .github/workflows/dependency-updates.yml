name: Weekly Dependency Updates
on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

# Prevent overlapping runs (e.g. a manual run during the scheduled one).
concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  dependency-updates:
    name: Claude dependency update pass
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT so Claude can push the branch and open a PR that triggers CI.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      # Trusted dependency: the prompt is sourced from spiriidk/ai-standards (org-owned)
      # at the default-branch tip so it always reflects the current standard. This couples
      # the workflow's behaviour to that repo — keep it on the trusted-repos list.
      - name: Fetch dependency-update prompt
        id: prompt
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eo pipefail
          # Write outside the workspace so Claude (running here with contents: write)
          # can't accidentally commit the prompt into the dependency-update branch.
          gh api repos/spiriidk/ai-standards/contents/prompts/stewardship-dependency-updates-node-repos.md \
            --jq '.content' | base64 -d | sed -n '/^## The prompt/,$p' > "$RUNNER_TEMP/prompt.md"
          if [ ! -s "$RUNNER_TEMP/prompt.md" ]; then
            echo "::error::Fetched dependency-update prompt is empty" >&2
            exit 1
          fi
          {
            echo 'value<<__PROMPT_EOF__'
            echo "REPO: ${{ github.repository }}"
            echo
            cat "$RUNNER_TEMP/prompt.md"
            echo            # guarantee a newline so the closing delimiter is on its own line
            echo '__PROMPT_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude dependency update
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT drives all git / gh / PR operations (used automatically by the action).
          github_token: ${{ secrets.RELEASE_TOKEN }}
          prompt: ${{ steps.prompt.outputs.value }}
          claude_args: |
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Glob,Grep"
