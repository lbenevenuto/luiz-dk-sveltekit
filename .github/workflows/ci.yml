name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the release job (main pushes) gets write access.
permissions:
  contents: read

# PR runs share a group so superseded ones cancel; each main push gets its own group so none is dropped.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check
        env:
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SALT: ${{ secrets.SALT }}
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Test with coverage thresholds
        run: bun run test -- --coverage

      - name: Build
        run: bun run build
        env:
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SALT: ${{ secrets.SALT }}
          BASE_URL: ${{ vars.BASE_URL }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
