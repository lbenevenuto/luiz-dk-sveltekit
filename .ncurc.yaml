# npm-check-updates configuration.
# The previous wrangler hold (Node >=22) no longer applies: CI runs scripts
# under Bun, whose node-compat satisfies it.
reject:
  # typescript-eslint@8.63.0 (latest) peer dep caps typescript at "<6.1.0".
  # TS 7.0.2 would break linting via ERESOLVE until typescript-eslint adds
  # TS 7 support. Revisit once typescript-eslint raises its typescript range.
  - typescript
  # layercake@11 ("The No More Stores Edition") rewrites the core to Svelte 5
  # runes and removes the store-based component context API with no shim.
  # src/lib/components/charts/layercake/context.ts and every chart layer
  # (AxisX, AxisY, Bars, Area, Arcs, Line, Tooltip, BarTooltip) read
  # `getContext('LayerCake')` as Readable stores ($xScale, $width, $height,
  # ...). Upgrading needs a full rewrite of those layers — out of scope for
  # a routine update pass.
  - layercake
