# npm-check-updates configuration.
# The previous wrangler hold (Node >=22) no longer applies: CI runs scripts
# under Bun, whose node-compat satisfies it.
reject:
  # typescript-eslint@8.63.0 (latest) peer dep caps typescript at "<6.1.0".
  # TS 7.0.2 would break linting via ERESOLVE until typescript-eslint adds
  # TS 7 support. Revisit once typescript-eslint raises its typescript range.
  - typescript
  # layercake@11 rewrites the core library to use Svelte 5 runes and removes
  # the store API for components. Our chart wrappers (src/lib/components/charts/layercake/*)
  # consume LayerCake context via Svelte `Readable` stores ($xScale, $width, $height, ...),
  # which v11 no longer provides. Upgrading requires rewriting those components -
  # out of scope for a routine dependency-update pass.
  - layercake
