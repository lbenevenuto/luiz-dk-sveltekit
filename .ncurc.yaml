# npm-check-updates configuration.
# The previous wrangler hold (Node >=22) no longer applies: CI runs scripts
# under Bun, whose node-compat satisfies it.
reject:
  # typescript-eslint@8.63.0 (latest) peer dep caps typescript at "<6.1.0".
  # TS 7.0.2 would break linting via ERESOLVE until typescript-eslint adds
  # TS 7 support. Revisit once typescript-eslint raises its typescript range.
  - typescript
  # @tanstack/svelte-table 9.1.2 (stable) redesigns table creation: row-model
  # getters like getCoreRowModel/getPaginationRowModel passed directly to
  # createTable are replaced by a required `features: tableFeatures({...})`
  # composition object. Our code (AnalyticsDashboard.svelte, admin/urls
  # +page.svelte) still uses the old alpha.10 pattern and would break.
  # Revisit as a dedicated migration task.
  - '@tanstack/svelte-table'
