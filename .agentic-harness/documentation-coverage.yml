  no_business_rule_reason: Delivery infrastructure; consumer business rules require
    separate domain documentation.
  contracts: 'Input: an explicit project root, actual source files, YAML registries
    and optional real Git base. Output: diagnostics and nonzero exit status on a blocking
    error. Bootstrap writes only during an explicitly invoked creation operation.'
  invariants: hDS is mandatory. Product and standard versions are independent. Technical
    documents have reciprocal human/AI identities. Source changes invalidate their
    stored coverage hashes. No critical violation is converted into success.
  failure_modes: Malformed metadata, missing documents, broken links, stale source
    hashes, absent review evidence, new or edited source over 500 lines and detected
    duplicate blocks involving touched files fail completion. Untouched inherited
    debt is queued. Runtime/tool errors also fail. A passing lexical detector does
    not prove absence of semantic duplication.
  validation: Run bash scripts/run_all_checks.sh. OS regression tests generate an
    isolated capsule and inject violations to verify failures. Product lint, typecheck,
    tests and build must run through declared stack checks once product implementation
    exists.
  business_impact: Infrastructure enforces delivery governance. Product rules must
    be authored separately under docs/business, with human/AI pairs and references
    from coverage units whenever implementation introduces or changes those rules.
  responsibility: Validate hDS document metadata, human/AI pairs, revisions, local
    links, assets and documentary exceptions. Parsing is deterministic and offline;
    document truth and semantic equivalence require agent review. This module never
    repairs product code.
